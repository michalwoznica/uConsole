name: Validate AXP20x battery delta

on:
  push:
    paths:
      - 'kernel/source.lock'
      - 'kernel/patches/0004-power-axp20x-program-design-capacity.patch'
      - 'kernel/sources/axp20x-battery.lock'
      - 'kernel/overlays/clockworkpi-uconsole-cm4-overlay.dts'
      - 'scripts/validate-axp20x-battery.sh'
      - '.github/workflows/validate-axp20x-battery.yml'
  pull_request:
    paths:
      - 'kernel/source.lock'
      - 'kernel/patches/0004-power-axp20x-program-design-capacity.patch'
      - 'kernel/sources/axp20x-battery.lock'
      - 'kernel/overlays/clockworkpi-uconsole-cm4-overlay.dts'
      - 'scripts/validate-axp20x-battery.sh'
      - '.github/workflows/validate-axp20x-battery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-axp20x:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install ARM64 kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends             bc bison flex gcc-aarch64-linux-gnu libelf-dev libssl-dev             make patch curl
      - name: Validate minimal AXP20x battery delta
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          JOBS: '2'
        run: bash ./scripts/validate-axp20x-battery.sh
