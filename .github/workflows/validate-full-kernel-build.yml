name: Validate full uConsole kernel build

on:
  push:
    paths:
      - 'kernel/source.lock'
      - 'kernel/config/**'
      - 'kernel/drivers/uconsole-amp-switch.c'
      - 'kernel/overlays/clockworkpi-uconsole-cm4-overlay.dts'
      - 'kernel/patches/0001-drm-panel-integrate-cwu50.patch'
      - 'kernel/patches/0002-video-backlight-integrate-ocp8178.patch'
      - 'kernel/patches/0003-arm-dts-build-uconsole-cm4-overlay.patch'
      - 'kernel/patches/0004-power-axp20x-program-design-capacity.patch'
      - 'kernel/patches/0005-misc-integrate-uconsole-amplifier-switch.patch'
      - 'kernel/sources/cwu50.lock'
      - 'kernel/sources/ocp8178.lock'
      - 'image/archlinuxarm/packages/linux-uconsole/**'
      - 'scripts/stage-arch-kernel-package.sh'
      - 'scripts/validate-full-kernel-build.sh'
      - '.github/workflows/validate-full-kernel-build.yml'
  pull_request:
    paths:
      - 'kernel/source.lock'
      - 'kernel/config/**'
      - 'kernel/drivers/uconsole-amp-switch.c'
      - 'kernel/overlays/clockworkpi-uconsole-cm4-overlay.dts'
      - 'kernel/patches/0001-drm-panel-integrate-cwu50.patch'
      - 'kernel/patches/0002-video-backlight-integrate-ocp8178.patch'
      - 'kernel/patches/0003-arm-dts-build-uconsole-cm4-overlay.patch'
      - 'kernel/patches/0004-power-axp20x-program-design-capacity.patch'
      - 'kernel/patches/0005-misc-integrate-uconsole-amplifier-switch.patch'
      - 'kernel/sources/cwu50.lock'
      - 'kernel/sources/ocp8178.lock'
      - 'image/archlinuxarm/packages/linux-uconsole/**'
      - 'scripts/stage-arch-kernel-package.sh'
      - 'scripts/validate-full-kernel-build.sh'
      - '.github/workflows/validate-full-kernel-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM64 kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends             bc bison flex gcc-aarch64-linux-gnu libelf-dev libssl-dev             make patch curl rsync device-tree-compiler kmod

      - name: Build and validate full uConsole kernel package
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          JOBS: '2'
        run: bash ./scripts/validate-full-kernel-build.sh
