name: Build uConsole Arch Linux ARM image

on:
  push:
    paths:
      - 'kernel/**'
      - 'image/archlinuxarm/rootfs.lock'
      - 'image/archlinuxarm/image-layout.lock'
      - 'image/archlinuxarm/stage9a-stock-kernel-boot-packages.txt'
      - 'image/shared/boot/config-uconsole-cm4.txt'
      - 'image/shared/rootfs/**'
      - 'image/archlinuxarm/boot/cmdline-uconsole-cm4.txt'
      - 'image/archlinuxarm/rootfs/**'
      - 'image/shared/packages/linux-uconsole/**'
      - 'scripts/lib/**'
      - 'scripts/stage-kernel-package.sh'
      - 'scripts/build-archlinuxarm-rootfs.sh'
      - 'scripts/build-archlinuxarm-image.sh'
      - 'scripts/build-archlinuxarm.sh'
      - 'docs/STAGE10_FIRST_IMAGE.md'
      - '.github/workflows/build-archlinuxarm-image.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'image/archlinuxarm/rootfs.lock'
      - 'image/archlinuxarm/image-layout.lock'
      - 'image/archlinuxarm/stage9a-stock-kernel-boot-packages.txt'
      - 'image/shared/boot/config-uconsole-cm4.txt'
      - 'image/shared/rootfs/**'
      - 'image/archlinuxarm/boot/cmdline-uconsole-cm4.txt'
      - 'image/archlinuxarm/rootfs/**'
      - 'image/shared/packages/linux-uconsole/**'
      - 'scripts/lib/**'
      - 'scripts/stage-kernel-package.sh'
      - 'scripts/build-archlinuxarm-rootfs.sh'
      - 'scripts/build-archlinuxarm-image.sh'
      - 'scripts/build-archlinuxarm.sh'
      - 'docs/STAGE10_FIRST_IMAGE.md'
      - '.github/workflows/build-archlinuxarm-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare host image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dosfstools \
            e2fsprogs \
            libarchive-tools \
            rsync \
            util-linux \
            zstd
          docker version

      - name: Build and validate uConsole image
        env:
          CONTAINER_RUNTIME: docker
          UCONSOLE_BUILD_DIR: ${{ runner.temp }}/uconsole-archlinuxarm
          UCONSOLE_ARTIFACT_DIR: ${{ runner.temp }}/uconsole-archlinuxarm/artifacts
          UCONSOLE_CACHE_DIR: ${{ runner.temp }}/uconsole-archlinuxarm-cache
        run: |
          bash ./scripts/build-archlinuxarm.sh

      - name: Show artifact sizes
        run: |
          ls -lh "$RUNNER_TEMP/uconsole-archlinuxarm/artifacts"
          du -sh "$RUNNER_TEMP/uconsole-archlinuxarm/artifacts"

      - name: Upload Arch Linux ARM image artifact
        uses: actions/upload-artifact@v4
        with:
          name: uconsole-archlinuxarm-image
          path: |
            ${{ runner.temp }}/uconsole-archlinuxarm/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
