name: Validate OCP8178 port

on:
  push:
    paths:
      - 'kernel/**'
      - 'scripts/validate-ocp8178-port.sh'
      - '.github/workflows/validate-ocp8178.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'scripts/validate-ocp8178-port.sh'
      - '.github/workflows/validate-ocp8178.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-ocp8178:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install ARM64 kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends             bc bison flex gcc-aarch64-linux-gnu libelf-dev libssl-dev             make patch curl

      - name: Validate OCP8178 source port
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          JOBS: '2'
        run: ./scripts/validate-ocp8178-port.sh
