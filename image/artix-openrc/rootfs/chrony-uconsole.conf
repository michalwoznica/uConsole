# uConsole Artix/OpenRC network-time policy.
#
# The CM4 target has no usable hardware RTC. OpenRC swclock preserves a
# reasonable time across clean shutdowns; chronyd corrects it from network time
# whenever connectivity is available.

pool pool.ntp.org iburst

driftfile /var/lib/chrony/drift

# A fresh or power-loss boot can be far from real time. Permit an immediate
# correction during the first three clock updates instead of attempting an
# impractically long slew from an epoch-era timestamp.
makestep 1.0 3
