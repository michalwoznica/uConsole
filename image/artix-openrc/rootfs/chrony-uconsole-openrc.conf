# uConsole Artix/OpenRC chrony service overrides.
#
# A fresh image may boot before Wi-Fi has ever been configured. Do not make
# chronyd's lifetime depend on OpenRC's virtual `net` service: chronyd can run
# without connectivity and will retry DNS/source resolution after networking
# becomes available.
rc_need="!net"

# The packaged OpenRC service otherwise waits for chronyd's self-backgrounding
# startup path. Keep boot non-blocking while the device may still be offline.
FAST_STARTUP="yes"
