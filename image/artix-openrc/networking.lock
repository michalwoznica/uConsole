# Artix/OpenRC networking package identities for the uConsole target.
#
# These package versions were observed in the ARMtix aarch64 world repository
# when the networking integration checkpoint was prepared. The rootfs
# networking configurator requires these exact top-level package identities.
#
# Dependency-closure acquisition remains a host/build-orchestration concern.
# The configurator accepts a caller-supplied package directory and verifies
# every supplied payload is for aarch64 or any before the offline transaction.

NETWORK_REPO_BASE_URL=https://repo.armtixlinux.org/world/os/aarch64

NETWORKMANAGER_PKGNAME=networkmanager
NETWORKMANAGER_PKGVER=1.58.1-2
NETWORKMANAGER_PKGARCH=aarch64

NETWORKMANAGER_OPENRC_PKGNAME=networkmanager-openrc
NETWORKMANAGER_OPENRC_PKGVER=20210505-6
NETWORKMANAGER_OPENRC_PKGARCH=any

NETWORKMANAGER_SERVICE=NetworkManager
