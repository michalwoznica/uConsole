# Deterministic Artix Linux / OpenRC image identity and partition contract.
#
# Geometry intentionally matches the accepted Arch Linux ARM target so both
# targets exercise the same shared low-level image mechanics. Disk/filesystem
# identities are target-specific so Arch and Artix media remain unambiguous.

PARTITION_TABLE=dos
DISK_IDENTIFIER_HEX=0x55434152

BOOT_PARTITION_NUMBER=1
ROOT_PARTITION_NUMBER=2

BOOT_PARTUUID=55434152-01
ROOT_PARTUUID=55434152-02

BOOT_FILESYSTEM=vfat
ROOT_FILESYSTEM=ext4

BOOT_MOUNTPOINT=/boot
ROOT_MOUNTPOINT=/

LOGICAL_SECTOR_SIZE=512
IMAGE_SIZE_BYTES=8589934592

BOOT_START_SECTOR=8192
BOOT_SIZE_SECTORS=1048576
ROOT_START_SECTOR=1056768

BOOT_PARTITION_TYPE=c
ROOT_PARTITION_TYPE=83
BOOT_PARTITION_BOOTABLE=yes

BOOT_VOLUME_ID_HEX=55434101
BOOT_FILESYSTEM_LABEL=UCONARTBOOT

ROOT_FILESYSTEM_UUID=55434152-5449-5800-8000-000000000002
ROOT_FILESYSTEM_LABEL=UCONARTROOT
