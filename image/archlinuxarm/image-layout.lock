# Deterministic Arch Linux ARM image identity and partition contract.
#
# DOS/MBR is intentionally used for the first uConsole microSD image because
# it matches the traditional Raspberry Pi/Arch Linux ARM two-partition layout.
# The fixed disk identifier makes PARTUUID values reproducible.

PARTITION_TABLE=dos
DISK_IDENTIFIER_HEX=0x55434f4e

BOOT_PARTITION_NUMBER=1
ROOT_PARTITION_NUMBER=2

BOOT_PARTUUID=55434f4e-01
ROOT_PARTUUID=55434f4e-02

BOOT_FILESYSTEM=vfat
ROOT_FILESYSTEM=ext4

BOOT_MOUNTPOINT=/boot
ROOT_MOUNTPOINT=/

# Arch Linux ARM concrete image geometry.
LOGICAL_SECTOR_SIZE=512
IMAGE_SIZE_BYTES=8589934592

BOOT_START_SECTOR=8192
BOOT_SIZE_SECTORS=1048576
ROOT_START_SECTOR=1056768

BOOT_PARTITION_TYPE=c
ROOT_PARTITION_TYPE=83
BOOT_PARTITION_BOOTABLE=yes

# Deterministic filesystem identities. Mount policy continues to use PARTUUID.
BOOT_VOLUME_ID_HEX=55434F01
BOOT_FILESYSTEM_LABEL=UCONBOOT

ROOT_FILESYSTEM_UUID=55434f4e-534f-4c45-8000-000000000002
ROOT_FILESYSTEM_LABEL=UCONSOLEROOT
